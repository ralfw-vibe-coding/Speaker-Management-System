    <text x="890" y="438" font-size="13" font-weight="700" fill="#1f2124">Yannick Sobotta</text>
    <text x="890" y="456" font-size="11" fill="#656a71">2 Beiträge · 1 ohne Thema</text>
    <rect x="890" y="468" width="146" height="5" rx="2.5" fill="#e3e5e9"/>
    <rect x="890" y="468" width="88" height="5" rx="2.5" fill="#1f9d5b"/>
    <text x="890" y="490" font-size="10.5" fill="#656a71">3 von 5 erledigt</text>
    <text x="890" y="506" font-size="10.5" fill="#a06b3c">Abstract und Foto fehlen</text>
  </g>

  <!-- Karte 4 -->
  <g>
    <rect x="874" y="524" width="176" height="98" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
    <rect x="874" y="534" width="3.5" height="78" rx="1.75" fill="#1f9d5b"/>
    <text x="890" y="546" font-size="13" font-weight="700" fill="#1f2124">B. Kuraszkiewicz</text>
    <text x="890" y="564" font-size="11" fill="#656a71">2 Beiträge · 2.900 €</text>
    <rect x="890" y="576" width="146" height="5" rx="2.5" fill="#e3e5e9"/>
    <rect x="890" y="576" width="58" height="5" rx="2.5" fill="#1f9d5b"/>
    <text x="890" y="598" font-size="10.5" fill="#656a71">2 von 5 erledigt</text>
    <rect x="890" y="604" width="106" height="16" rx="8" fill="#fdf2f2"/>
    <text x="943" y="616" font-size="10" font-weight="700" fill="#8f3d3d" text-anchor="middle">⚠ 1 Beitrag heimatlos</text>
