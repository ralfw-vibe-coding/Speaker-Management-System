<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="800" viewBox="0 0 1720 800" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <rect width="1720" height="800" fill="#ffffff"/>

  <!-- ============ Kopfbereich ============ -->
  <text x="32" y="52" font-size="25" font-weight="700" fill="#1f2124">Assistenz Summit 2026</text>
  <text x="32" y="76" font-size="13.5" fill="#656a71">Die Zukunft der Vorstandsassistenz · Acme Events · 4.–5. November 2026</text>

  <g font-size="12">
    <rect x="1246" y="34" width="126" height="26" rx="13" fill="#f2f3f5"/>
    <circle cx="1262" cy="47" r="4" fill="#c2c6cc"/>
    <text x="1272" y="51" fill="#4a4f56">11 Kandidaten</text>

    <rect x="1380" y="34" width="118" height="26" rx="13" fill="#e9f6ef"/>
    <circle cx="1396" cy="47" r="4" fill="#1f9d5b"/>
    <text x="1406" y="51" fill="#1c6b45">5 zugesagt</text>

    <rect x="1506" y="34" width="126" height="26" rx="13" fill="#fbeeee"/>
    <circle cx="1522" cy="47" r="4" fill="#b04a4a"/>
    <text x="1532" y="51" fill="#8f3d3d">2 gestrichen</text>
  </g>
  <text x="1688" y="78" font-size="12.5" fill="#656a71" text-anchor="end">Honorar <tspan font-weight="700" fill="#1f2124">18.400 €</tspan> von 25.000 € · Deadline Programm 30.09.</text>

  <!-- Sichtenwechsel -->
  <g>
