    <text x="474" y="260" font-size="10.5" fill="#a2a7ae">Antwort 28.06. · Thema offen</text>
  </g>

  <!-- ============ Spalte: in Verhandlung ============ -->
  <rect x="656" y="156" width="196" height="560" rx="10" fill="#f5f6f8"/>
  <circle cx="672" cy="177" r="4" fill="#d9772e"/>
  <text x="684" y="181" font-size="12.5" font-weight="700" fill="#3b4046">in Verhandlung</text>
  <rect x="816" y="168" width="22" height="18" rx="9" fill="#e3e5e9"/>
  <text x="827" y="181" font-size="11" font-weight="600" fill="#656a71" text-anchor="middle">1</text>
  <line x1="666" y1="192" x2="842" y2="192" stroke="#e3e5e9"/>

