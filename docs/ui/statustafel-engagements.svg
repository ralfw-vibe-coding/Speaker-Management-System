    <rect x="874" y="210" width="3.5" height="78" rx="1.75" fill="#1f9d5b"/>
    <text x="890" y="222" font-size="13" font-weight="700" fill="#1f2124">Marek Lindqvist</text>
    <text x="890" y="240" font-size="11" fill="#656a71">2 Beiträge · 2.400 €</text>
    <rect x="890" y="252" width="146" height="5" rx="2.5" fill="#e3e5e9"/>
    <rect x="890" y="252" width="146" height="5" rx="2.5" fill="#1f9d5b"/>
    <text x="890" y="274" font-size="10.5" fill="#656a71">5 von 5 erledigt</text>
    <rect x="890" y="280" width="88" height="16" rx="8" fill="#e9f6ef"/>
    <text x="934" y="292" font-size="10" font-weight="700" fill="#1c6b45" text-anchor="middle">✓ vollständig</text>
