    <text x="223" y="124" font-size="13" fill="#767b82" text-anchor="middle">Agenda</text>

    <rect x="286" y="102" width="146" height="34" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
    <text x="359" y="124" font-size="13" fill="#767b82" text-anchor="middle">Speakerkatalog</text>
  </g>

  <!-- ============ Spalte: gemerkt ============ -->
  <rect x="32" y="156" width="196" height="560" rx="10" fill="#f5f6f8"/>
  <circle cx="48" cy="177" r="4" fill="#9298a0"/>
  <text x="60" y="181" font-size="12.5" font-weight="700" fill="#3b4046">gemerkt</text>
