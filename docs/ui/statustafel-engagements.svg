  <!-- ============ Ausgang: gestrichen ============ -->
  <rect x="1496" y="156" width="192" height="560" rx="10" fill="#fbf7f7" stroke="#eddede"/>
  <circle cx="1512" cy="177" r="4" fill="#b04a4a"/>
  <text x="1524" y="181" font-size="12.5" font-weight="700" fill="#8f3d3d">gestrichen</text>
  <rect x="1652" y="168" width="22" height="18" rx="9" fill="#f3e2e2"/>
  <text x="1663" y="181" font-size="11" font-weight="600" fill="#8f3d3d" text-anchor="middle">2</text>
  <line x1="1506" y1="192" x2="1678" y2="192" stroke="#eddede"/>

  <g>
    <rect x="1506" y="200" width="172" height="66" rx="8" fill="#ffffff" stroke="#eddede"/>
    <text x="1520" y="222" font-size="12.5" font-weight="700" fill="#6b7078">Prof. Dr. Elke Warnke</text>
    <text x="1520" y="240" font-size="10.5" fill="#a2a7ae">Terminkonflikt</text>
    <text x="1520" y="256" font-size="10.5" fill="#a2a7ae">Slot 11:00 Track A ist frei</text>
  </g>
  <g>
    <rect x="1506" y="276" width="172" height="66" rx="8" fill="#ffffff" stroke="#eddede"/>
    <text x="1520" y="298" font-size="12.5" font-weight="700" fill="#6b7078">Jens Brodowski</text>
    <text x="1520" y="316" font-size="10.5" fill="#a2a7ae">Honorarvorstellung zu hoch</text>
    <text x="1520" y="332" font-size="10.5" fill="#a2a7ae">für 2027 vormerken</text>
  </g>

  <text x="1506" y="372" font-size="10.5" fill="#b6bbc2">Spur bleibt am Engagement.</text>

  <!-- ============ Legende ============ -->
  <line x1="32" y1="744" x2="1688" y2="744" stroke="#e3e5e9"/>
  <g font-size="11.5" fill="#656a71">
    <text x="32" y="768">Karten werden zwischen den Spalten gezogen. Der Balken in „zugesagt" ist die Checkliste je Speaker — grün heißt inhaltlich fertig, noch vor der Veranstaltung.</text>
    <text x="1688" y="768" text-anchor="end" fill="#9298a0">„gestrichen" erreicht man aus jeder Spalte.</text>
  </g>

</svg>
