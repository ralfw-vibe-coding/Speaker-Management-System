  <rect x="448" y="156" width="196" height="560" rx="10" fill="#f5f6f8"/>
  <circle cx="464" cy="177" r="4" fill="#3573b9"/>
  <text x="476" y="181" font-size="12.5" font-weight="700" fill="#3b4046">geantwortet</text>
  <rect x="608" y="168" width="22" height="18" rx="9" fill="#e3e5e9"/>
  <text x="619" y="181" font-size="11" font-weight="600" fill="#656a71" text-anchor="middle">1</text>
  <line x1="458" y1="192" x2="634" y2="192" stroke="#e3e5e9"/>

  <g>
    <rect x="458" y="200" width="176" height="76" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
