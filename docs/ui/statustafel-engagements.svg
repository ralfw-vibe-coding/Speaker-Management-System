    <text x="56" y="339" font-size="10.5" fill="#a2a7ae">Empfehlung von M. Kern</text>
  </g>
  <g>
    <rect x="42" y="364" width="176" height="72" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
