    <text x="1098" y="222" font-size="13" font-weight="700" fill="#1f2124">Petra Vahlbruch</text>
    <text x="1098" y="240" font-size="11" fill="#656a71">2 Beiträge · 3.400 €</text>
    <text x="1098" y="257" font-size="10.5" fill="#a2a7ae">Agentur rechnet bei Vertrag ab</text>
    <rect x="1098" y="266" width="120" height="18" rx="9" fill="#e6f4f4"/>
    <text x="1158" y="279" font-size="10.5" font-weight="600" fill="#0b6a6a" text-anchor="middle">fällig am 01.09.</text>
  </g>

  <!-- ============ Spalte: bezahlt ============ -->
  <rect x="1280" y="156" width="196" height="560" rx="10" fill="#f5f6f8"/>
  <circle cx="1296" cy="177" r="4" fill="#14663f"/>
  <text x="1308" y="181" font-size="12.5" font-weight="700" fill="#3b4046">bezahlt</text>
  <text x="1440" y="181" font-size="11" fill="#9298a0" text-anchor="end">fertig</text>
  <line x1="1290" y1="192" x2="1466" y2="192" stroke="#e3e5e9"/>

