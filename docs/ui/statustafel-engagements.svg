    <rect x="890" y="360" width="146" height="5" rx="2.5" fill="#e3e5e9"/>
    <rect x="890" y="360" width="117" height="5" rx="2.5" fill="#1f9d5b"/>
    <text x="890" y="382" font-size="10.5" fill="#656a71">4 von 5 erledigt</text>
    <text x="890" y="398" font-size="10.5" fill="#a06b3c">Vertrag fehlt noch</text>
