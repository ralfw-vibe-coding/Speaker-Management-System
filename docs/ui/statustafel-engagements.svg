    <text x="56" y="240" font-size="11" fill="#656a71">New Work &amp; Führung</text>
    <text x="56" y="257" font-size="10.5" fill="#a2a7ae">gefunden auf der ACO 2025</text>
  </g>
  <g>
    <rect x="42" y="282" width="176" height="72" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
