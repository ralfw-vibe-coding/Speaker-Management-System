    <text x="56" y="421" font-size="10.5" fill="#a2a7ae">2024 schon einmal dabei</text>
  </g>
  <g>
    <rect x="42.5" y="446.5" width="175" height="38" rx="8" fill="#fafbfc" stroke="#d5d9de" stroke-dasharray="5 4"/>
