  <text x="411" y="181" font-size="11" font-weight="600" fill="#656a71" text-anchor="middle">1</text>
  <line x1="250" y1="192" x2="426" y2="192" stroke="#e3e5e9"/>

  <g>
    <rect x="250" y="200" width="176" height="90" rx="8" fill="#ffffff" stroke="#e3e5e9"/>
    <rect x="250" y="210" width="3.5" height="70" rx="1.75" fill="#7b6cd9"/>
    <text x="266" y="222" font-size="13" font-weight="700" fill="#1f2124">Christa Nowak</text>
    <text x="266" y="240" font-size="11" fill="#656a71">2 Beiträge angefragt</text>
